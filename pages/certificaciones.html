      <div class="cert-card">
        <img
          class="cert-img"
          src="https://res.cloudinary.com/dzsalq5g6/image/upload/v1777447774/Certificacion_scrum_zsuzkc.jpg"

        />

          <span class="cert-emisor">SCRUMstudy</span>
          <p class="cert-nombre">Scrum Fundamentals Certified (SFC)</p>
          <span class="cert-fecha">2025</span>
        </div>
        <div class="cert-divider"></div>
        <div class="cert-footer">
          <div class="cert-tags">
            <span class="cert-tag">Scrum</span>
          </div>
          <a
            class="cert-link"
            href="https://www.scrumstudy.com/certification/verify?type=SFC&number=1094518"
            target="_blank"
            rel="noopener noreferrer"
          >
            Ver certificado
            <svg
              width="11"
              height="11"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"

              <path d="M2 10L10 2M10 2H5M10 2v5" />
            </svg>
          </a>
        </div>
      </div>

          <span class="cert-fecha">2024</span>
        </div>
        <div class="cert-divider"></div>
        <div class="cert-footer">
