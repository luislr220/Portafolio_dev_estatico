<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/contacto.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/Foto_Mia.jpg"
    />
    <title>Contacto - Luis Armando</title>
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav>
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="../pages/sobreMi.html">Sobre mí</a></li>
          <li><a href="../pages/contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <section class="contacto-seccion">
      <p class="sobreMi-titulo">¡Hablemos!</p>

      <div class="container-contacto-minimal">
        <div class="card-contacto-directo">
          <div class="header-contacto">
            <h3>¿Tienes un proyecto en mente o una vacante FullStack?</h3>
            <p>
              Estoy disponible para colaboraciones y oportunidades
              profesionales. Elige el canal que prefieras:
            </p>
          </div>

          <div class="grid-enlaces">
            <a
              href="https://github.com/luislr220"
              target="_blank"
              class="enlace-card"
            >
              <div class="icon-container">
                <img src="../assets/icon-github.png" alt="icon-github" />
              </div>
              <div class="enlace-texto">
                <span>GitHub</span>
                <p>Revisa mis repositorios y lógica</p>
              </div>
            </a>

            <div
              class="enlace-card principal"
              id="copyEmail"
              style="cursor: pointer"
            >
              <div class="icon-container">
                <img src="../assets/icon-copy.png" alt="icon-copy" />
              </div>
              <div class="enlace-texto">
                <span>Correo Electrónico</span>
                <p id="emailText">largoramirezluisarmando@gmail.com</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="../js/contacto.js"></script>
    <script src="../js/navbar.js"></script>
  </body>
</html>
